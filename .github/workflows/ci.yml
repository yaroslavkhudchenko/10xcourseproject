name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx astro sync
      - run: npm run lint
      - name: Check design token contrast
        run: node scripts/check-token-contrast.mjs
      - run: npx astro check
      - run: npm run test
      - run: npm run build

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          # Pinned: CLI releases change config keys (auto_expose_new_tables is removed on 2026-10-30).
          version: 2.117.0
      - run: npm ci
      - name: Start local Supabase
        run: |
          supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,realtime,storage-api,postgres-meta,supavisor
          supabase status -o env | grep -E '^(API_URL|ANON_KEY)=' > supabase.env
      - name: Configure secrets for build and preview
        run: |
          source supabase.env
          printf 'SUPABASE_URL=%s\nSUPABASE_KEY=%s\n' "$API_URL" "$ANON_KEY" > .env
          cp .env .dev.vars
      - name: Check shop gate database contract
        run: |
          source supabase.env
          SUPABASE_URL="$API_URL" SUPABASE_KEY="$ANON_KEY" node scripts/check-shop-gate-db.mjs
      - name: Check watchlist database contract
        run: |
          source supabase.env
          SUPABASE_URL="$API_URL" SUPABASE_KEY="$ANON_KEY" node scripts/check-watchlist-db.mjs
      - name: Check shop matches database contract
        run: |
          source supabase.env
          SUPABASE_URL="$API_URL" SUPABASE_KEY="$ANON_KEY" node scripts/check-matches-db.mjs
      - name: Check price observations database contract
        run: |
          source supabase.env
          SUPABASE_URL="$API_URL" SUPABASE_KEY="$ANON_KEY" node scripts/check-prices-db.mjs
      - name: Check the database catalogue
        run: |
          source supabase.env
          SUPABASE_URL="$API_URL" SUPABASE_KEY="$ANON_KEY" node scripts/check-catalog-db.mjs
      - name: Check the deploy gate against the local stack
        run: |
          source supabase.env
          export CHECK_SUPABASE_URL="$API_URL" CHECK_SUPABASE_KEY="$ANON_KEY"
          # The local stack has every migration, so the gate passes, which also proves that anon may execute
          # applied_migrations().
          node scripts/check-migrations-applied.mjs
          # A copy of the migrations with one the database lacks must be refused, naming that version as missing: a run
          # that fails for another reason names no missing version.
          migrations_copy="$RUNNER_TEMP/migrations-with-one-unapplied"
          mkdir -p "$migrations_copy"
          cp supabase/migrations/*.sql "$migrations_copy/"
          touch "$migrations_copy/29991231235959_never_applied.sql"
          gate_log="$RUNNER_TEMP/deploy-gate-missing.log"
          if node scripts/check-migrations-applied.mjs --migrations-dir="$migrations_copy" > "$gate_log" 2>&1; then
            cat "$gate_log"
            echo "FAIL  the deploy gate passed although the database lacks 29991231235959"
            exit 1
          fi
          cat "$gate_log"
          grep -q "Missing on the database: 29991231235959" "$gate_log" || { echo "FAIL  the deploy gate failed without naming 29991231235959 as missing"; exit 1; }
      - run: npm run build
      - name: Run smoke test, two-user check and production check against production preview
        run: |
          npm run preview -- --port 4321 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:4321/ && break; sleep 1; done
          BASE_URL=http://localhost:4321 npm run smoke
          source supabase.env
          # A second user gets nothing of the first's through any route that takes a product's id.
          SUPABASE_URL="$API_URL" SUPABASE_KEY="$ANON_KEY" BASE_URL=http://localhost:4321 node scripts/check-two-users.mjs
          export CHECK_APP_URL=http://localhost:4321 CHECK_SUPABASE_URL="$API_URL" CHECK_SUPABASE_KEY="$ANON_KEY"
          # The production check, signed out: its pages and its sign-in probe pass against the preview.
          node scripts/check-production.mjs --skip=settings
          # Its settings group must fail here, where local sign-up stays on (supabase/config.toml), and on the answer
          # it read: a run that got no answer names no disable_signup=false.
          settings_log="$RUNNER_TEMP/production-check-settings.log"
          if node scripts/check-production.mjs --only=settings > "$settings_log" 2>&1; then
            cat "$settings_log"
            echo "FAIL  the settings group passed although local sign-up is on"
            exit 1
          fi
          cat "$settings_log"
          grep -q "disable_signup=false" "$settings_log" || { echo "FAIL  the settings group failed without reading disable_signup=false"; exit 1; }
      - if: always()
        run: supabase stop --no-backup

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # The CLI pin and the services left out below are the smoke job's: change them in both jobs together.
      - uses: supabase/setup-cli@v1
        with:
          # Pinned: CLI releases change config keys (auto_expose_new_tables is removed on 2026-10-30).
          version: 2.117.0
      - run: npm ci
      - name: Start local Supabase
        run: |
          supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,realtime,storage-api,postgres-meta,supavisor
          supabase status -o env | grep -E '^(API_URL|ANON_KEY)=' > supabase.env
      - name: Configure secrets for build and preview
        run: |
          source supabase.env
          printf 'SUPABASE_URL=%s\nSUPABASE_KEY=%s\n' "$API_URL" "$ANON_KEY" > .env
          cp .env .dev.vars
      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium
      # GitHub sets CI, so the config builds the app and starts the workerd preview itself.
      - name: Run e2e tests against production preview
        run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
      - if: always()
        run: supabase stop --no-backup
